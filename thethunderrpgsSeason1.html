<html lang="en" style="-webkit-tap-highlight-color: transparent; user-select: none; height: 100%; overscroll-behavior: contain; --sekai-bg-color: #0f172a; --sekai-text-color: #f8fafc;"><head>
<script>
(function() {
  if (typeof CustomEvent === 'function') return;
  function CustomEvent(event, params) {
    params = params || { bubbles: false, cancelable: false, detail: null };
    var evt = document.createEvent('CustomEvent');
    evt.initCustomEvent(event, params.bubbles, params.cancelable, params.detail);
    return evt;
  }
  CustomEvent.prototype = window.Event && window.Event.prototype;
  window.CustomEvent = CustomEvent;
})();
</script>

<script>
(function() {
  // Function to set or update viewport meta tag
  function ensureViewportMeta() {
    var viewportMeta = document.querySelector('meta[name="viewport"]');
    
    if (!viewportMeta) {
      // Create viewport meta tag if it doesn't exist
      viewportMeta = document.createElement('meta');
      viewportMeta.name = 'viewport';
      document.head.insertBefore(viewportMeta, document.head.firstChild);
    }
    
    // Set viewport to prevent iOS auto-zoom
    // width=device-width: Use device width
    // initial-scale=1.0: Initial zoom level
    // maximum-scale=1.0: Prevent zooming beyond 1.0
    // user-scalable=no: Disable user scaling (prevents pinch zoom and auto-zoom on input focus)
    viewportMeta.content = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no';
  }
  
  // Run immediately if DOM is already ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', ensureViewportMeta);
  } else {
    ensureViewportMeta();
  }
  
  // Also ensure it's set when head is ready (in case script runs before head)
  if (!document.head) {
    var observer = new MutationObserver(function(mutations) {
      if (document.head) {
        ensureViewportMeta();
        observer.disconnect();
      }
    });
    observer.observe(document.documentElement, { childList: true });
  }
})();
</script>

<script>
(function() {
  var originalAddEventListener = EventTarget.prototype.addEventListener;
  var originalRemoveEventListener = EventTarget.prototype.removeEventListener;

  // ── Tap vs Swipe detection ──
  // Track pointerdown position; only synthesize click when displacement is small.
  var ptrDownPos = null;
  var TAP_THRESHOLD_SQ = 100; // 10px squared

  originalAddEventListener.call(document, 'pointerdown', function(e) {
    if (e.button !== 0) return;
    ptrDownPos = { x: e.clientX, y: e.clientY };
  }, { capture: true, passive: true });

  function isTap(e) {
    if (!ptrDownPos) return true; // no pointerdown recorded — be safe, treat as tap
    var dx = e.clientX - ptrDownPos.x;
    var dy = e.clientY - ptrDownPos.y;
    return (dx * dx + dy * dy) <= TAP_THRESHOLD_SQ;
  }

  // ── click → pointerup conversion ──
  var listenerMap = new WeakMap();

  EventTarget.prototype.addEventListener = function(type, listener, options) {
    if (type === 'click' && typeof listener === 'function') {
      var elementMap = listenerMap.get(this);
      if (!elementMap) {
        elementMap = new Map();
        listenerMap.set(this, elementMap);
      }

      var existingPointerListener = elementMap.get(listener);
      if (existingPointerListener) {
        return originalAddEventListener.call(this, 'pointerup', existingPointerListener, options);
      }

      var pointerupListener = function(e) {
        if (e.button !== 0) return;
        if (!isTap(e)) return;

        var clickEvent = new MouseEvent('click', {
          bubbles: e.bubbles, cancelable: e.cancelable, view: e.view,
          detail: 1,
          screenX: e.screenX, screenY: e.screenY,
          clientX: e.clientX, clientY: e.clientY,
          ctrlKey: e.ctrlKey, altKey: e.altKey,
          shiftKey: e.shiftKey, metaKey: e.metaKey,
          button: e.button, relatedTarget: e.relatedTarget
        });
        Object.defineProperty(clickEvent, 'target', { value: e.target, enumerable: true });
        Object.defineProperty(clickEvent, 'currentTarget', { value: e.currentTarget, enumerable: true });

        try { listener.call(this, clickEvent); } catch (err) {}
      };

      elementMap.set(listener, pointerupListener);
      return originalAddEventListener.call(this, 'pointerup', pointerupListener, options);
    }

    return originalAddEventListener.call(this, type, listener, options);
  };

  EventTarget.prototype.removeEventListener = function(type, listener, options) {
    if (type === 'click' && typeof listener === 'function') {
      var elementMap = listenerMap.get(this);
      if (elementMap) {
        var pointerupListener = elementMap.get(listener);
        if (pointerupListener) {
          elementMap.delete(listener);
          return originalRemoveEventListener.call(this, 'pointerup', pointerupListener, options);
        }
      }
    }
    return originalRemoveEventListener.call(this, type, listener, options);
  };

  // ── Synthetic click for .onclick compatibility ──
  // Only dispatch when the gesture is a tap (not a swipe).
  var SEKAI_SYNTHETIC_KEY = '__sekai_sc';

  originalAddEventListener.call(document, 'pointerup', function(e) {
    if (e.button !== 0) return;
    if (!isTap(e)) return;
    var t = e.target;
    if (!t || !t.dispatchEvent) return;
    // Native form controls activate through the click's DEFAULT ACTION, which
    // the blocker below cannot suppress (stopImmediatePropagation stops
    // listeners, not default actions). Synthesizing a click here would
    // activate them twice: a checkbox toggles on, then straight back off, so
    // a clean tap looks dead. Leave them to the browser's own click.
    if (t.closest && t.closest('input, select, textarea, option, label')) return;

    var evt = new MouseEvent('click', {
      bubbles: true, cancelable: true, view: e.view,
      detail: 1,
      screenX: e.screenX, screenY: e.screenY,
      clientX: e.clientX, clientY: e.clientY,
      ctrlKey: e.ctrlKey, altKey: e.altKey,
      shiftKey: e.shiftKey, metaKey: e.metaKey,
      button: 0, relatedTarget: null
    });
    Object.defineProperty(evt, SEKAI_SYNTHETIC_KEY, { value: true });
    t.dispatchEvent(evt);
  }, false);

  // Deduplicate native clicks: only block when a synthetic click already fired
  // for this pointer cycle. This prevents double-triggering while letting native
  // clicks through when the synthetic dispatch didn't run (e.g. pointerup was
  // stopped before bubbling to document, or the target was skipped above).
  // Blocking unconditionally would strip inline onclick handlers off the
  // controls skipped above, since their click no longer has a synthetic twin.
  var lastSyntheticTs = 0;
  var DEDUP_MS = 50;

  var _origDispatchEvent = EventTarget.prototype.dispatchEvent;
  EventTarget.prototype.dispatchEvent = function(evt) {
    if (evt.type === 'click' && evt[SEKAI_SYNTHETIC_KEY]) {
      lastSyntheticTs = Date.now();
    }
    return _origDispatchEvent.call(this, evt);
  };

  originalAddEventListener.call(document, 'click', function(e) {
    if (!e[SEKAI_SYNTHETIC_KEY] && (Date.now() - lastSyntheticTs) < DEDUP_MS) {
      e.stopImmediatePropagation();
    }
  }, true);
})();
</script>

<script>
(function() {
  // Track recent touch to block emulated mouse events
  var lastTouchTime = 0;
  var TOUCH_MOUSE_DELAY = 200; // ms to block mouse events after touch

  // Global touch tracker - set flag when touch occurs
  document.addEventListener('touchstart', function() {
    lastTouchTime = Date.now();
  }, { passive: true, capture: true });

  document.addEventListener('touchend', function() {
    lastTouchTime = Date.now();
  }, { passive: true, capture: true });

  // Block emulated mouse events that follow touch
  // BUT allow them on focusable elements (inputs need mousedown for focus)
  function blockEmulatedMouseHandler(e) {
    if (Date.now() - lastTouchTime < TOUCH_MOUSE_DELAY) {
      // Don't block on focusable elements - they need mousedown for focus
      var target = e.target;
      if (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable) {
        return; // Allow the event
      }
      e.stopPropagation();
      // NOTE: Do NOT call preventDefault() here.
      // CSS user-select:none already handles text selection prevention.
      // On iOS WKWebView, mousedown.preventDefault() can intermittently
      // suppress click event synthesis, breaking .onclick handlers.
    }
  }

  // Capture phase blockers for emulated mouse events
  document.addEventListener('mousedown', blockEmulatedMouseHandler, { capture: true });

  // Patch addEventListener to force passive on touch events.
  // Expose original globally so SCROLL_BLOCK_SCRIPT can register a
  // non-passive touchmove handler to block iOS WKWebView parent scroll.
  var originalAddEventListener = EventTarget.prototype.addEventListener;
  window.__sekai_orig_ael = originalAddEventListener;

  EventTarget.prototype.addEventListener = function(type, listener, options) {
    // Convert touchstart/touchmove to passive
    // Mouse event emulation is handled by our global blockers above
    if (type === 'touchstart' || type === 'touchmove') {
      var newOptions = Object.assign({}, options || {}, { passive: true });
      return originalAddEventListener.call(this, type, listener, newOptions);
    }
    return originalAddEventListener.call(this, type, listener, options);
  };
})();
</script>

<script>
(function() {
  // Track if dom_ready was already sent
  var domReadySent = false;

  function sendDomReady() {
    if (domReadySent) return;
    domReadySent = true;
    window.parent.postMessage({ type: 'sekai_iframe_dom_ready' }, '*');
  }

  // Send dom_ready when DOMContentLoaded fires
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', sendDomReady);
  } else {
    // DOM already loaded
    sendDomReady();
  }

  // Helper to serialize message - handles objects that would become [object Object]
  function serializeMessage(msg) {
    if (msg === null || msg === undefined) return '';
    if (typeof msg === 'string') return msg;
    if (typeof msg === 'object') {
      try {
        return JSON.stringify(msg);
      } catch (e) {
        return String(msg);
      }
    }
    return String(msg);
  }

  // Catch JS errors and send to parent
  window.onerror = function(message, source, lineno, colno, error) {
    window.parent.postMessage({
      type: 'sekai_iframe_js_error',
      message: serializeMessage(message),
      source: source || '',
      lineno: lineno || 0,
      colno: colno || 0,
      errorName: error ? error.name : '',
      errorStack: error ? error.stack : ''
    }, '*');
    // Return false to allow default error handling
    return false;
  };

  // Also catch unhandled promise rejections
  window.addEventListener('unhandledrejection', function(event) {
    var reason = event.reason;
    var isError = reason instanceof Error;
    window.parent.postMessage({
      type: 'sekai_iframe_js_error',
      message: reason ? serializeMessage(reason) : 'Unhandled promise rejection',
      source: 'unhandledrejection',
      lineno: 0,
      colno: 0,
      errorName: isError ? reason.name : '',
      errorStack: isError ? reason.stack : ''
    }, '*');
  });
})();
</script>

<script>
(function() {
  // Collect all devicemotion listeners registered by game code
  var deviceMotionListeners = [];

  // Save original addEventListener
  var originalAddEventListener = window.addEventListener;

  // Intercept addEventListener to capture devicemotion listeners
  window.addEventListener = function(type, listener, options) {
    if (type === 'devicemotion' && typeof listener === 'function') {
      deviceMotionListeners.push(listener);
      // Also add to native in case permission is granted elsewhere
      return originalAddEventListener.call(this, type, listener, options);
    }
    return originalAddEventListener.call(this, type, listener, options);
  };

  // Also intercept removeEventListener
  var originalRemoveEventListener = window.removeEventListener;
  window.removeEventListener = function(type, listener, options) {
    if (type === 'devicemotion' && typeof listener === 'function') {
      var index = deviceMotionListeners.indexOf(listener);
      if (index !== -1) {
        deviceMotionListeners.splice(index, 1);
      }
    }
    return originalRemoveEventListener.call(this, type, listener, options);
  };

  // Listen for forwarded motion data from parent
  window.addEventListener('message', function(event) {
    if (!event.data || event.data.type !== '__sekai_device_motion__') return;

    var data = event.data;

    // Create a synthetic event-like object
    var syntheticEvent = {
      accelerationIncludingGravity: data.accelerationIncludingGravity,
      acceleration: data.acceleration,
      rotationRate: data.rotationRate,
      interval: data.interval || 16,
      // Make it look like a real event
      type: 'devicemotion',
      timeStamp: data.timestamp || Date.now(),
      target: window,
      currentTarget: window,
      preventDefault: function() {},
      stopPropagation: function() {},
      stopImmediatePropagation: function() {}
    };

    // Trigger all registered listeners
    deviceMotionListeners.forEach(function(listener) {
      try {
        listener(syntheticEvent);
      } catch (e) {
        // Ignore listener errors
      }
    });
  });
})();
</script>

<script>
(function() {
  // Track all AudioContexts created in this iframe
  var audioContexts = [];
  var originalAudioContext = window.AudioContext || window.webkitAudioContext;

  if (originalAudioContext) {
    // Patch AudioContext constructor to track instances and enforce initial mute state.
    // If isMuted is true when the context is created, suspend it immediately so that
    // AudioNode sources cannot produce audio before the parent sends receive_audio_mute.
    // This closes the race window between iframe load start and the first mute message.
    var PatchedAudioContext = function() {
      var ctx = new originalAudioContext();
      audioContexts.push(ctx);
      // Per-ctx diagnostic flags. Each AudioContext instance warns at most
      // once for each of the two diagnostics below, so a rAF-driven
      // resume() loop (observed in real games) does not spam vconsole,
      // while new contexts still act as fresh sentinels.
      var resumeBlockWarned = false;
      var browserResumeWarned = false;
      if (typeof ctx.resume === 'function') {
        var originalCtxResume = ctx.resume.bind(ctx);
        ctx.resume = function() {
          if (isMuted) {
            // Game code attempted to resume AudioContext during mute window.
            // Blocked here prevents the audibility observer from reporting a
            // false playing_started. Logged once per ctx to confirm the
            // "game code calls resume()" leak path is real.
            if (!resumeBlockWarned) {
              resumeBlockWarned = true;
              try {
                console.warn(
                  '[sekai-iframe-audio] AudioContext.resume() blocked while muted (once per ctx)'
                );
              } catch (e) {}
            }
            return Promise.resolve();
          }
          return originalCtxResume();
        };
      }
      if (isMuted) {
        ctx.suspend().catch(function() {});
      }
      // Feed perf audibility observer: re-evaluate whenever the context
      // transitions between suspended/running/closed. ctx.suspend()/resume()
      // resolve asynchronously, so the statechange event is the only reliable
      // signal that the context has actually moved.
      try {
        ctx.addEventListener('statechange', function() {
          // Sentinel: resume() is blocked above while muted, so if the ctx
          // still enters 'running' during mute, the only remaining cause is
          // browser-initiated state recovery (e.g. iOS audio session
          // interruption ending). If this log ever appears in practice, the
          // resume() block alone is not enough — we must also guard
          // notifyAudibilityChange() to suppress audible=true while muted.
          // Logged once per ctx to avoid repeated warnings on oscillating
          // state transitions.
          if (ctx.state === 'running' && isMuted && !browserResumeWarned) {
            browserResumeWarned = true;
            try {
              console.warn(
                '[sekai-iframe-audio] AudioContext entered running while muted (browser-initiated, once per ctx)'
              );
            } catch (e) {}
          }
          scheduleAudibilityCheck();
        });
      } catch (e) {
        // Ignore listener attach failures on non-conforming contexts
      }
      return ctx;
    };
    PatchedAudioContext.prototype = originalAudioContext.prototype;
    window.AudioContext = PatchedAudioContext;
    if (window.webkitAudioContext) {
      window.webkitAudioContext = PatchedAudioContext;
    }
  }

  // Track all Audio objects (including those created via new Audio())
  var audioElements = [];
  var originalAudio = window.Audio;
  
  function rememberMutedState(el) {
    if (!el) return;
    try {
      if (!mutedElements.has(el)) {
        mutedElements.set(el, !!el.muted);
      }
    } catch (e) {
      // Ignore muted state snapshot failures
    }
  }

  if (originalAudio) {
    window.Audio = function(src) {
      var audio = new originalAudio(src);
      audioElements.push(audio);
      if (isMuted) {
        rememberMutedState(audio);
        try { audio.muted = true; } catch (e) {}
      }
      return audio;
    };
    // Preserve prototype chain
    window.Audio.prototype = originalAudio.prototype;
  }

  // Track video elements created via createElement
  var videoElements = [];
  var originalCreateElement = document.createElement;

  document.createElement = function(tagName) {
    var element = originalCreateElement.call(document, tagName);

    // Track audio and video elements
    if (typeof tagName === 'string') {
      var tag = tagName.toLowerCase();
      if (tag === 'audio') {
        audioElements.push(element);
        if (isMuted) {
          rememberMutedState(element);
          try { element.muted = true; } catch (e) {}
        }
      } else if (tag === 'video') {
        videoElements.push(element);
        if (isMuted) {
          rememberMutedState(element);
          try { element.muted = true; } catch (e) {}
        }
      }
    }

    return element;
  };

  // Track elements that are INTENDED to be playing (based on .play()/.pause() calls).
  // This is more reliable than checking .paused at mute time, because iOS pauses
  // audio elements when the app goes to background BEFORE our JS visibility handler
  // runs — by the time muteAllAudio() is called, all elements are already paused
  // by the OS and .paused === true for all of them.
  var intendedPlaying = new Set();

  if (window.HTMLMediaElement) {
    var originalHTMLPlay = HTMLMediaElement.prototype.play;
    var originalHTMLPause = HTMLMediaElement.prototype.pause;
    var internalPause = false;

    HTMLMediaElement.prototype.play = function() {
      intendedPlaying.add(this);
      if (isMuted) {
        rememberMutedState(this);
        try { this.muted = true; } catch (e) {}
        try {
          if (!this.paused) {
            internalPause = true;
            originalHTMLPause.call(this);
          }
        } catch (e) {
          // Ignore pause failures while muted
        } finally {
          internalPause = false;
        }
        return Promise.resolve();
      }
      return originalHTMLPlay.apply(this, arguments);
    };

    HTMLMediaElement.prototype.pause = function() {
      if (!internalPause) {
        intendedPlaying.delete(this);
      }
      return originalHTMLPause.apply(this, arguments);
    };
  }

  // Track elements queued for playback resume — retried on each user touchstart
  // until all elements are playing again. More reliable than { once: true } because
  // it survives cases where the first touch fires before unmuteAllAudio() processes
  // the message (postMessage is async; user may touch the moment they switch back).
  var pendingResume = [];

  // Track muted state to restore correctly
  var mutedElements = new WeakMap();
  var isMuted = false;

  function collectTrackedMediaElements() {
    var elements = [];
    var seen = new Set();

    function pushElement(el) {
      if (!el || seen.has(el)) return;
      seen.add(el);
      elements.push(el);
    }

    document.querySelectorAll('audio, video').forEach(pushElement);
    audioElements.forEach(pushElement);
    videoElements.forEach(pushElement);

    return elements;
  }

  function pauseElementForMute(el) {
    if (!el) return;

    if (!el.paused && !el.ended) {
      intendedPlaying.add(el);
    }

    try {
      internalPause = true;
      el.pause();
    } finally {
      internalPause = false;
    }
  }

  function lockElementAudio(el) {
    if (!el) return;
    rememberMutedState(el);
    pauseElementForMute(el);
    try {
      el.muted = true;
    } catch (e) {
      // Ignore mute failures for stale or invalid elements
    }
  }

  function muteAllAudio() {
    if (isMuted) return;
    isMuted = true;
    pendingResume = []; // Clear queued resumes — new mute cycle resets state

    // Suspend all AudioContexts
    audioContexts.forEach(function(ctx) {
      if (ctx && ctx.state === 'running') {
        ctx.suspend().catch(function() {});
      }
    });

    // Pause first, then force mute so background playback cannot leak audio.
    // The audibility observer below will automatically emit
    // sekai_iframe_audio_playing_stopped once the pause/mute propagates, so
    // we no longer post a separate sekai_iframe_audio_muted confirmation.
    collectTrackedMediaElements().forEach(function(el) {
      try {
        lockElementAudio(el);
      } catch (e) {
        // Element might be stale or invalid
      }
    });
  }

  function resumeAllContexts() {
    audioContexts.forEach(function(ctx) {
      // Call resume() on any non-closed context, including 'running'.
      // Reason: muteAllAudio() calls ctx.suspend(), which is async. If
      // unmuteAllAudio() (or a touchstart retry) runs before suspend() resolves,
      // ctx.state is still 'running' — the old suspended/interrupted-only guard
      // would skip it, then suspend() resolves and the context stays permanently
      // suspended. By calling resume() on 'running' contexts too, we queue a
      // resume after the pending suspend, so both operations execute in order
      // (suspend → resume) and the context ends up running as intended.
      // resume() on an already-running context is a no-op per the Web Audio spec.
      if (ctx && ctx.state !== 'closed') {
        ctx.resume().catch(function() {});
      }
    });
  }

  function unmuteAllAudio() {
    if (!isMuted) return;
    isMuted = false;

    // Resume all AudioContexts immediately (handles 'suspended' and 'interrupted')
    resumeAllContexts();

    // Restore tracked media elements to their original muted state.
    collectTrackedMediaElements().forEach(function(el) {
      var wasMuted = mutedElements.get(el);
      if (wasMuted !== undefined) {
        el.muted = wasMuted;
      } else {
        el.muted = false;
      }
    });
    mutedElements = new WeakMap();

    // Queue intended elements for playback resume.
    // iOS pauses audio/video elements on app-switch before our JS handler runs,
    // so simply unmuting is not enough — we must call .play() to restore.
    // We populate pendingResume here; the persistent touchstart listener below
    // retries on every user touch until all elements are playing again.
    pendingResume = [];
    intendedPlaying.forEach(function(el) {
      if (!el || el.ended) return;
      pendingResume.push(el);
    });
    // Also attempt immediately — succeeds on iOS versions / audio session states
    // that allow .play() without a fresh user gesture.
    pendingResume.forEach(function(el) {
      try { if (el.paused) el.play().catch(function() {}); } catch(e) {}
    });
  }

  // Persistent touchstart listener — fires on every user touch while unmuted.
  // Retries AudioContext resume and HTML5 element .play() until all succeed.
  // Registered once at script init using capture phase so game code stopPropagation
  // cannot prevent it from running.
  //
  // Why persistent instead of { once: true }:
  // - postMessage delivery is async; the user may touch before unmuteAllAudio()
  //   processes the receive_audio_unmute message, consuming a { once: true } slot
  // - iOS may reject .play() on the first attempt but allow it on subsequent ones
  document.addEventListener('touchstart', function() {
    if (isMuted) return;
    // Retry AudioContexts on every touch (handles 'interrupted' / 'suspended')
    resumeAllContexts();
    // Retry HTML5 elements still waiting to resume
    if (pendingResume.length === 0) return;
    var toTry = pendingResume;
    pendingResume = [];
    toTry.forEach(function(el) {
      try {
        if (!el.paused) return; // Already playing — no action needed
        el.play().catch(function() {
          pendingResume.push(el); // Failed — retry on next touch
        });
      } catch(e) {
        pendingResume.push(el);
      }
    });
  }, { passive: true, capture: true });

  function collectMediaFromNode(node) {
    if (!node || node.nodeType !== 1) return [];
    var elements = [];
    if (node.tagName === 'AUDIO' || node.tagName === 'VIDEO') {
      elements.push(node);
    }
    if (typeof node.querySelectorAll === 'function') {
      node.querySelectorAll('audio, video').forEach(function(el) {
        elements.push(el);
      });
    }
    return elements;
  }

  document.addEventListener('play', function(event) {
    if (!isMuted) return;
    var target = event.target;
    if (!target || typeof target.pause !== 'function') return;
    lockElementAudio(target);
  }, true);

  document.addEventListener('playing', function(event) {
    if (!isMuted) return;
    var target = event.target;
    if (!target || typeof target.pause !== 'function') return;
    lockElementAudio(target);
  }, true);

  var mutationObserverTarget = document.documentElement || document;
  if (typeof MutationObserver !== 'undefined' && mutationObserverTarget) {
    var mediaMutationObserver = new MutationObserver(function(mutations) {
      if (!isMuted) return;
      mutations.forEach(function(mutation) {
        mutation.addedNodes.forEach(function(node) {
          collectMediaFromNode(node).forEach(function(el) {
            lockElementAudio(el);
          });
        });
      });
    });
    mediaMutationObserver.observe(mutationObserverTarget, {
      childList: true,
      subtree: true,
    });
  }

  // ========================================================================
  // Audibility observer — parent-facing signal for feed perf dashboard.
  //
  // Fact measured: "is this iframe currently producing audible output?"

  <body data-phase="menu">
    <div id="game">
      <!-- #region @sekai:menu · Main Menu Screen -->
      <section class="screen absolute inset-0 flex flex-col justify-between p-6 z-40 bg-slate-900/95" data-show-on="menu">
        <div class="flex-1 flex flex-col items-center justify-center text-center space-y-6">
          <div class="text-xs font-bold text-yellow-300 uppercase tracking-widest bg-yellow-500/20 px-3 py-1 rounded-full border border-yellow-500/30">Version 1</div>
          <h1 class="text-5xl font-extrabold tracking-wider text-yellow-400 drop-shadow-[0_5px_5px_rgba(0,0,0,0.8)] uppercase" data-spec-id="menu-title">
            Thunder RPG
          </h1>
          <p class="text-slate-300 max-w-xs text-sm">
            Play as Phoebe Thunderman! Explore the town, school, home, and outside. Defeat villains with Freeze Breath and Fire Breath!
          </p>

          <!-- Character Previews -->
          <div class="flex gap-6 my-4">
            <!-- Character profiles updated/clarified -->
          </div>
        </div>

        <div class="space-y-3 w-full max-w-sm mx-auto pb-8">
          <button id="btn-start-game" data-spec-id="btn-start-game" class="w-full py-4 bg-yellow-500 hover:bg-yellow-400 text-slate-950 font-black text-xl rounded-xl shadow-lg border-b-4 border-yellow-700 uppercase tracking-wider">
            Enter RPG World
          </button>
          <button id="btn-copy-html" class="w-full py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-sm rounded-lg border border-slate-700 uppercase tracking-wider">
            Copy HTML
          </button>
        </div>
      </section>
      <!-- #endregion @sekai:menu -->

      <!-- #region @sekai:playing · Main Gameplay Screen -->
      <section class="screen absolute inset-0 flex flex-col z-10" data-show-on="playing">
        <!-- Canvas Area -->
        <canvas id="game-canvas" class="absolute inset-0 w-full h-full z-0" width="980" height="1678"></canvas>

        <!-- HUD Overlay -->
        <div class="absolute top-0 left-0 right-0 p-4 flex justify-between items-start pointer-events-none z-20">
          <!-- Left: Stats -->
          <div class="bg-slate-900/80 backdrop-blur-sm p-3 rounded-xl border border-slate-700/50 flex flex-col gap-1 pointer-events-auto">
            <div class="flex items-center gap-2">
              <span class="text-xs font-bold text-slate-400 uppercase">Score:</span>
              <span id="hud-score" data-spec-id="hud-score" class="text-lg font-black text-yellow-400">0</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-xs font-bold text-slate-400 uppercase">Location:</span>
              <span id="hud-location" data-spec-id="hud-location" class="text-xs font-bold text-cyan-400 uppercase">home</span>
            </div>
          </div>

          <!-- Right: Menu / Reset -->
          <div class="flex flex-col gap-2 pointer-events-auto">
            <button id="btn-menu" data-spec-id="btn-menu" class="px-3 py-2 bg-slate-800/90 border border-slate-700 text-xs font-bold rounded-lg text-slate-300">
              Main Menu
            </button>
          </div>
        </div>

        <!-- Location Quick Travel / Portals HUD -->
        <div class="absolute top-20 left-4 right-4 flex justify-center gap-1 pointer-events-none z-20">
          <div class="bg-slate-900/80 backdrop-blur-sm p-1.5 rounded-lg border border-slate-700/50 flex gap-1 pointer-events-auto overflow-x-auto max-w-full">
            <button data-travel="home" class="btn-travel px-2.5 py-1 rounded text-xs font-bold bg-cyan-600 text-white">Home</button>
            <button data-travel="town" class="btn-travel px-2.5 py-1 rounded text-xs font-bold bg-slate-700 text-slate-300">Town</button>
            <button data-travel="school" class="btn-travel px-2.5 py-1 rounded text-xs font-bold bg-slate-700 text-slate-300">School</button>
            <button data-travel="outside" class="btn-travel px-2.5 py-1 rounded text-xs font-bold bg-slate-700 text-slate-300">Outside</button>
          </div>
        </div>

        <!-- Bottom Controls: Joystick & Attacks -->
        <div class="absolute bottom-0 left-0 right-0 p-6 flex justify-between items-end pointer-events-none z-20">
          <!-- Left: Virtual Joystick -->
          <div id="joystick-container" class="w-28 h-28 rounded-full bg-slate-900/60 border-2 border-slate-700/50 relative flex items-center justify-center pointer-events-auto">
            <div id="joystick-knob" class="w-12 h-12 rounded-full bg-yellow-500/80 border border-yellow-400 shadow-md absolute transition-all duration-75" style="transform: translate(0px, 0px);"></div>
          </div>

          <!-- Right: Attack Buttons -->
          <div class="flex flex-col gap-3 pointer-events-auto">
            <button id="btn-freeze" data-spec-id="btn-freeze" class="w-16 h-16 rounded-full bg-cyan-500 hover:bg-cyan-400 border-4 border-cyan-300 flex flex-col items-center justify-center shadow-lg text-slate-950 font-black text-xs uppercase tracking-tighter">
              <span>Freeze</span>
              <span class="text-[9px] opacity-80">Breath</span>
            </button>
            <button id="btn-fire" data-spec-id="btn-fire" class="w-16 h-16 rounded-full bg-orange-600 hover:bg-orange-500 border-4 border-orange-400 flex flex-col items-center justify-center shadow-lg text-white font-black text-xs uppercase tracking-tighter">
              <span>Fire</span>
              <span class="text-[9px] opacity-80">Breath</span>
            </button>
          </div>
        </div>
      </section>
      <!-- #endregion @sekai:playing -->

      <!-- #region @sekai:gameover · Game Over Screen -->
      <section class="screen absolute inset-0 flex flex-col justify-center items-center p-6 z-40 bg-slate-950/95" data-show-on="gameover">
        <div class="text-center space-y-6 max-w-xs">
          <h2 class="text-4xl font-black text-red-500 uppercase tracking-wider">Villains Defeated!</h2>
          <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-2">
            <p class="text-slate-400 text-sm">Final Score</p>
            <p id="text-final-score" data-spec-id="text-final-score" class="text-3xl font-black text-yellow-400">0</p>
          </div>
          <button id="btn-restart" data-spec-id="btn-restart" class="w-full py-4 bg-yellow-500 hover:bg-yellow-400 text-slate-950 font-black text-lg rounded-xl shadow-lg uppercase tracking-wider">
            Play Again
          </button>
        </div>
      </section>
      <!-- #endregion @sekai:gameover -->
    </div>

    <script type="module">
      import { applyAllEditableValues, getConfig, saveAppResult, vibrate } from './js/sekai/bridge/index.js';

      //#region @sekai:state · Game State Definition
      function createState() {
        return {
          phase: 'menu', // 'menu' | 'playing' | 'gameover'
          score: 0,
          location: 'home', // 'home' | 'town' | 'school' | 'outside'
          player: {
            x: 150,
            y: 250,
            targetX: 150,
            targetY: 250,
            speed: 4,
            dirX: 0,
            dirY: 0,
            width: 48,
            height: 48,
            facing: 'right'
          },
          maxNpc: {
            x: 250,
            y: 220,
            width: 48,
            height: 48,
            state: 'idle', // 'idle' | 'follow'
            timer: 0
          },
          villains: [], // active villains in current location
          projectiles: [], // breath attacks
          particles: [],
          joystick: {
            active: false,
            startX: 0,
            startY: 0,
            curX: 0,
            curY: 0,
            maxDist: 40
          },
          lastSpawnTime: 0,
          spawnInterval: 3000
        };
      }

      let state = createState();
      //#endregion @sekai:state

      //#region @sekai:assets · Asset References & Fallbacks
      // User-provided assets
      const phoebeImgUrl = getConfig('images', 'user-image-1-mya-amber-roblox-channel-av');
      const maxImgUrl = getConfig('images', 'user-image-2-roblox-red-headphones-hoodi');

      // Optional generic assets
      const villainImgUrl = getConfig('images', 'user-image-3-noli_2drender');

      // SFX
      const freezeSfxUrl = getConfig('sfx', 'freeze-breath-blast');
      const fireSfxUrl = getConfig('sfx', 'fire-breath-blast');
      const hitSfxUrl = getConfig('sfx', 'villain-hit-impact');

      // Image objects
      const images = {
        phoebe: null,
        max: null,
        villain: null
      };

      function loadImages() {
        if (phoebeImgUrl) {
          images.phoebe = new Image();
          images.phoebe.src = phoebeImgUrl;
        }
        if (maxImgUrl) {
          images.max = new Image();
          images.max.src = maxImgUrl;
        }
        if (villainImgUrl) {
          images.villain = new Image();
          images.villain.src = villainImgUrl;
        }
      }

      // Web Audio API Fallback for SFX
      let audioCtx = null;
      function getAudioContext() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        return audioCtx;
      }

      function playSound(type) {
        if (type === 'freeze') {
          if (freezeSfxUrl) {
            new Audio(freezeSfxUrl).play().catch(() => {});
          } else {
            playSynthSound(440, 880, 0.3, 'triangle');
          }
        } else if (type === 'fire') {
          if (fireSfxUrl) {
            new Audio(fireSfxUrl).play().catch(() => {});
          } else {
            playSynthSound(150, 50, 0.4, 'sawtooth');
          }
        } else if (type === 'hit') {
          if (hitSfxUrl) {
            new Audio(hitSfxUrl).play().catch(() => {});
          } else {
            playSynthSound(300, 100, 0.15, 'sine');
          }
        }
      }

      function playSynthSound(startFreq, endFreq, duration, type) {
        try {
          const ctx = getAudioContext();
          if (ctx.state === 'suspended') {
            ctx.resume();
          }
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(startFreq, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(endFreq, ctx.currentTime + duration);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + duration);
        } catch (e) {}
      }
      //#endregion @sekai:assets

      //#region @sekai:loop · Game Loop & Logic
      let canvas, ctx;
      let lastTime = 0;
      let loopId = null;

      function startLoop() {
        if (loopId) cancelAnimationFrame(loopId);
        lastTime = performance.now();
        loopId = requestAnimationFrame(updateLoop);
      }

      function stopLoop() {
        if (loopId) {
          cancelAnimationFrame(loopId);
          loopId = null;
        }
      }

      function updateLoop(timestamp) {
        if (state.phase !== 'playing') return;
        const dt = (timestamp - lastTime) / 1000;
        lastTime = timestamp;

        updateGameLogic(dt);
        drawGame();

        loopId = requestAnimationFrame(updateLoop);
      }

      function updateGameLogic(dt) {
        // 1. Player movement via joystick or target
        let dx = 0;
        let dy = 0;

        if (state.joystick.active) {
          const jdx = state.joystick.curX - state.joystick.startX;
          const jdy = state.joystick.curY - state.joystick.startY;
          const dist = Math.hypot(jdx, jdy);
          if (dist > 5) {
            dx = jdx / dist;
            dy = jdy / dist;
          }
        }

        if (dx !== 0 || dy !== 0) {
          state.player.x += dx * state.player.speed;
          state.player.y += dy * state.player.speed;
          if (dx > 0) state.player.facing = 'right';
          if (dx < 0) state.player.facing = 'left';
        }

        // Constrain player to canvas bounds
        state.player.x = Math.max(20, Math.min(canvas.width - 20 - state.player.width, state.player.x));
        state.player.y = Math.max(100, Math.min(canvas.height - 20 - state.player.height, state.player.y));

        // 2. Max NPC logic (follows player with a slight lag)
        const distToPlayer = Math.hypot(state.player.x - state.maxNpc.x, state.player.y - state.maxNpc.y);
        if (distToPlayer > 80) {
          const ndx = (state.player.x - state.maxNpc.x) / distToPlayer;
          const ndy = (state.player.y - state.maxNpc.y) / distToPlayer;
          state.maxNpc.x += ndx * (state.player.speed * 0.85);
          state.maxNpc.y += ndy * (state.player.speed * 0.85);
        }

        // 3. Spawning Villains (only in outside, town, or school)
        if (state.location !== 'home') {
          const now = Date.now();
          if (now - state.lastSpawnTime > state.spawnInterval && state.villains.length < 4) {
            spawnVillain();
            state.lastSpawnTime = now;
          }
        }

        // 4. Update Villains
        for (let i = state.villains.length - 1; i >= 0; i--) {
          const v = state.villains[i];
          if (v.status === 'frozen') {
            v.freezeTimer -= dt;
            if (v.freezeTimer <= 0) {
              v.status = 'active';
            }
          } else {
            // Move slowly towards player
            const vdx = state.player.x - v.x;
            const vdy = state.player.y - v.y;
            const vdist = Math.hypot(vdx, vdy);
            if (vdist > 10) {
              v.x += (vdx / vdist) * v.speed;
              v.y += (vdy / vdist) * v.speed;
            }
          }
        }

        // 5. Update Projectiles (Breath attacks)
        for (let i = state.projectiles.length - 1; i >= 0; i--) {
          const p = state.projectiles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.life -= dt;

          // Check collision with villains
          for (let j = state.villains.length - 1; j >= 0; j--) {
            const v = state.villains[j];
            const dist = Math.hypot(p.x - (v.x + v.width / 2), p.y - (v.y + v.height / 2));
            if (dist < 30) {
              // Hit!
              playSound('hit');
              vibrate(100);
              createHitParticles(p.x, p.y, p.type);

              if (p.type === 'freeze') {
                v.status = 'frozen';
                v.freezeTimer = 3.0; // freeze for 3 seconds
                v.hp -= 1;
              } else if (p.type === 'fire') {
                v.hp -= 2;
              }

              // Remove projectile
              state.projectiles.splice(i, 1);

              // Check if villain defeated
              if (v.hp <= 0) {
                state.villains.splice(j, 1);
                state.score += 10;
                document.getElementById('hud-score').textContent = state.score;

                // Check win condition (e.g. reach 100 score to win/end)
                if (state.score >= 100) {
                  endGame();
                }
              }
              break;
            }
          }

          // Remove dead projectiles
          if (p.life <= 0 && state.projectiles[i] === p) {
            state.projectiles.splice(i, 1);
          }
        }

        // 6. Update Particles
        for (let i = state.particles.length - 1; i >= 0; i--) {
          const p = state.particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.alpha -= dt * 2;
          if (p.alpha <= 0) {
            state.particles.splice(i, 1);
          }
        }
      }

      function spawnVillain() {
        const side = Math.random() > 0.5;
        const rx = side ? -30 : canvas.width + 30;
        const ry = 150 + Math.random() * (canvas.height - 250);
        state.villains.push({
          x: rx,
          y: ry,
          width: 44,
          height: 44,
          speed: 1.2 + Math.random() * 0.8,
          hp: 3,
          status: 'active',
          freezeTimer: 0,
          color: ['#a855f7', '#ec4899', '#3b82f6'][Math.floor(Math.random() * 3)]
        });
      }

      function createHitParticles(x, y, type) {
        const color = type === 'freeze' ? '#67e8f9' : '#f97316';
        for (let i = 0; i < 8; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 1 + Math.random() * 3;
          state.particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            color: color,
            alpha: 1.0,
            size: 3 + Math.random() * 4
          });
        }
      }
      //#endregion @sekai:loop

      //#region @sekai:render · Canvas Drawing
      function drawGame() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Background based on location
        drawBackground();

        // Draw Max NPC
        drawCharacter(state.maxNpc.x, state.maxNpc.y, state.maxNpc.width, state.maxNpc.height, 'max', 'left');

        // Draw Player (Phoebe)
        drawCharacter(state.player.x, state.player.y, state.player.width, state.player.height, 'phoebe', state.player.facing);

        // Draw Villains
        state.villains.forEach(v => {
          if (images.villain && images.villain.complete && images.villain.naturalWidth > 0) {
            ctx.drawImage(images.villain, v.x, v.y, v.width, v.height);
          } else {
            // Procedural Villain
            ctx.fillStyle = v.status === 'frozen' ? '#22d3ee' : v.color;
            ctx.beginPath();
            ctx.arc(v.x + v.width / 2, v.y + v.height / 2, v.width / 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();
            // Villain eyes
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(v.x + 10, v.y + 12, 6, 6);
            ctx.fillRect(v.x + 28, v.y + 12, 6, 6);
            ctx.fillStyle = '#000000';
            ctx.fillRect(v.x + 12, v.y + 14, 3, 3);
            ctx.fillRect(v.x + 30, v.y + 14, 3, 3);
          }

          // Freeze overlay
          if (v.status === 'frozen') {
            ctx.fillStyle = 'rgba(103, 232, 249, 0.4)';
            ctx.fillRect(v.x, v.y, v.width, v.height);
            ctx.strokeStyle = '#22d3ee';
            ctx.lineWidth = 2;
            ctx.strokeRect(v.x, v.y, v.width, v.height);
          }

          // HP Bar
          ctx.fillStyle = '#ef4444';
          ctx.fillRect(v.x, v.y - 8, v.width, 4);
          ctx.fillStyle = '#22c55e';
          ctx.fillRect(v.x, v.y - 8, v.width * (v.hp / 3), 4);
        });

        // Draw Projectiles
        state.projectiles.forEach(p => {
          ctx.fillStyle = p.type === 'freeze' ? '#22d3ee' : '#f97316';
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        });

        // Draw Particles
        state.particles.forEach(p => {
          ctx.save();
          ctx.globalAlpha = p.alpha;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });
      }

      function drawBackground() {
        // Draw sky/ground split
        const groundY = canvas.height * 0.4;

        if (state.location === 'home') {
          // Cozy living room
          ctx.fillStyle = '#1e293b';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#475569';
          ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

          // Draw a couch
          ctx.fillStyle = '#b91c1c';
          ctx.fillRect(50, groundY - 20, 120, 40);
          ctx.fillStyle = '#991b1b';
          ctx.fillRect(60, groundY - 35, 100, 15);

          // Draw a window
          ctx.fillStyle = '#38bdf8';
          ctx.fillRect(canvas.width - 100, 50, 60, 60);
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 3;
          ctx.strokeRect(canvas.width - 100, 50, 60, 60);
        } else if (state.location === 'town') {
          // RPG Town
          ctx.fillStyle = '#bae6fd';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#854d0e';
          ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

          // Draw simple houses
          ctx.fillStyle = '#f59e0b';
          ctx.fillRect(30, groundY - 60, 80, 60);
          ctx.fillStyle = '#b45309';
          ctx.beginPath();
          ctx.moveTo(20, groundY - 60);
          ctx.lineTo(70, groundY - 100);
          ctx.lineTo(120, groundY - 60);
          ctx.fill();
        } else if (state.location === 'school') {
          // School hallway
          ctx.fillStyle = '#cbd5e1';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#64748b';
          ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

          // Draw lockers
          ctx.fillStyle = '#0284c7';
          for (let i = 0; i < 4; i++) {
            ctx.fillRect(40 + i * 35, groundY - 80, 25, 80);
            ctx.fillStyle = '#0369a1';
            ctx.fillRect(45 + i * 35, groundY - 70, 3, 60);
            ctx.fillStyle = '#0284c7';
          }
        } else if (state.location === 'outside') {
          // Outside of house
          ctx.fillStyle = '#7dd3fc';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#15803d';
          ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

          // Draw trees
          ctx.fillStyle = '#78350f';
          ctx.fillRect(60, groundY - 50, 15, 50);
          ctx.fillStyle = '#166534';
          ctx.beginPath();
          ctx.arc(67, groundY - 60, 30, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawCharacter(x, y, w, h, type, facing) {
        const img = images[type];
        if (img && img.complete && img.naturalWidth > 0) {
          ctx.save();
          if (facing === 'left') {
            ctx.translate(x + w, y);
            ctx.scale(-1, 1);
            ctx.drawImage(img, 0, 0, w, h);
          } else {
            ctx.drawImage(img, x, y, w, h);
          }
          ctx.restore();
        } else {
          // Procedural fallback
          ctx.fillStyle = type === 'phoebe' ? '#eab308' : (type === 'max' ? '#3b82f6' : '#ef4444');
          ctx.beginPath();
          ctx.arc(x + w / 2, y + h / 2, w / 2, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 3;
          ctx.stroke();
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 16px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          const initial = type === 'phoebe' ? 'P' : (type === 'max' ? 'M' : 'V');
          ctx.fillText(initial, x + w / 2, y + h / 2);
        }
      }
      //#endregion @sekai:render

      //#region @sekai:input · Input Handling
      function setupInput() {
        // Travel buttons
        document.querySelectorAll('.btn-travel').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const loc = e.target.getAttribute('data-travel');
            changeLocation(loc);
          });
        });

        // Attack buttons
        document.getElementById('btn-freeze').addEventListener('click', () => {
          if (state.phase !== 'playing') return;
          performAttack('freeze');
        });

        document.getElementById('btn-fire').addEventListener('click', () => {
          if (state.phase !== 'playing') return;
          performAttack('fire');
        });

        // Joystick touch events
        const joyContainer = document.getElementById('joystick-container');
        const joyKnob = document.getElementById('joystick-knob');

        joyContainer.addEventListener('pointerdown', (e) => {
          state.joystick.active = true;
          const rect = joyContainer.getBoundingClientRect();
          state.joystick.startX = rect.left + rect.width / 2;
          state.joystick.startY = rect.top + rect.height / 2;
          state.joystick.curX = e.clientX;
          state.joystick.curY = e.clientY;
          joyContainer.setPointerCapture(e.pointerId);
          updateJoystickKnob();
        });

        joyContainer.addEventListener('pointermove', (e) => {
          if (!state.joystick.active) return;
          state.joystick.curX = e.clientX;
          state.joystick.curY = e.clientY;
          updateJoystickKnob();
        });

        const releaseJoystick = (e) => {
          if (!state.joystick.active) return;
          state.joystick.active = false;
          joyKnob.style.transform = 'translate(0px, 0px)';
        };

        joyContainer.addEventListener('pointerup', releaseJoystick);
        joyContainer.addEventListener('pointercancel', releaseJoystick);

        function updateJoystickKnob() {
          let dx = state.joystick.curX - state.joystick.startX;
          let dy = state.joystick.curY - state.joystick.startY;
          const dist = Math.hypot(dx, dy);

          if (dist > state.joystick.maxDist) {
            dx = (dx / dist) * state.joystick.maxDist;
            dy = (dy / dist) * state.joystick.maxDist;
          }

          joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
        }
      }

      function changeLocation(loc) {
        state.location = loc;
        document.getElementById('hud-location').textContent = loc;

        // Update travel button styles
        document.querySelectorAll('.btn-travel').forEach(btn => {
          if (btn.getAttribute('data-travel') === loc) {
            btn.classList.remove('bg-slate-700', 'text-slate-300');
            btn.classList.add('bg-cyan-600', 'text-white');
          } else {
            btn.classList.remove('bg-cyan-600', 'text-white');
            btn.classList.add('bg-slate-700', 'text-slate-300');
          }
        });

        // Clear current villains and spawn fresh ones
        state.villains = [];
        state.projectiles = [];
        state.lastSpawnTime = Date.now();
        vibrate(50);
      }

      function performAttack(type) {
        playSound(type);
        vibrate(50);

        const angle = state.player.facing === 'right' ? 0 : Math.PI;
        const speed = 8;

        // Spawn breath projectile
        state.projectiles.push({
          x: state.player.x + state.player.width / 2,
          y: state.player.y + state.player.height / 2,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          type: type,
          size: type === 'freeze' ? 12 : 16,
          life: 0.8
        });
      }
      //#endregion @sekai:input

      //#region @sekai:lifecycle · Game Lifecycle
      function initApp() {
        applyAllEditableValues();
        loadImages();

        canvas = document.getElementById('game-canvas');
        ctx = canvas.getContext('2d');

        // Resize canvas to fill screen
        function resizeCanvas() {
          canvas.width = canvas.clientWidth || window.innerWidth;
          canvas.height = canvas.clientHeight || window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Setup UI listeners
        document.getElementById('btn-start-game').addEventListener('click', startGame);
        document.getElementById('btn-menu').addEventListener('click', showMenu);
        document.getElementById('btn-restart').addEventListener('click', startGame);

        const btnCopy = document.getElementById('btn-copy-html');
        if (btnCopy) {
          btnCopy.addEventListener('click', () => {
            navigator.clipboard.writeText(document.documentElement.outerHTML).then(() => {
              const originalText = btnCopy.textContent;
              btnCopy.textContent = 'Copied!';
              vibrate(50);
              setTimeout(() => {
                btnCopy.textContent = originalText;
              }, 2000);
            }).catch(err => {
              console.error('Failed to copy HTML: ', err);
            });
          });
        }

        setupInput();
        showMenu();
      }

      function showMenu() {
        stopLoop();
        state.phase = 'menu';
        document.body.dataset.phase = 'menu';
      }

      function startGame() {
        vibrate(50);
        state = createState();
        state.phase = 'playing';
        document.body.dataset.phase = 'playing';
        document.getElementById('hud-score').textContent = '0';

        // Reset location
        changeLocation('home');

        if (canvas) {
          canvas.width = canvas.clientWidth || window.innerWidth;
          canvas.height = canvas.clientHeight || window.innerHeight;
        }

        startLoop();
      }

      function endGame() {
        stopLoop();
        state.phase = 'gameover';
        document.body.dataset.phase = 'gameover';
        document.getElementById('text-final-score').textContent = state.score;

        saveAppResult({
          score: state.score,
          public: true,
          result: { score: state.score }
        });
      }

      if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', initApp);
      } else {
        initApp();
      }
      //#endregion @sekai:lifecycle
    </script>
